<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<title>Misk Velvet</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F2F0EC;--card:#fff;--card2:#F8F7F4;--border:#E2DDD6;--sep:#EDEBE7;--gold:#8B6F4E;--gold-dim:#C4A882;--text:#1A1714;--text2:#6B6058;--text3:#A09080;--cat-k-bg:#FDF0F4;--cat-k:#C4607A;--cat-e-bg:#EFF6FB;--cat-e:#3A7FA8;--cat-u-bg:#F0F7EE;--cat-u:#4A8A3A;--nav-h:62px;--safe-b:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
.site-header{padding:20px 16px 14px;text-align:center;background:#fff;border-bottom:1px solid var(--border)}
.site-header h1{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:400;font-size:clamp(18px,5vw,24px);letter-spacing:.03em}
.header-line{width:32px;height:1px;background:var(--gold-dim);margin:8px auto 0}
#active-strip{display:none;padding:8px 12px;gap:6px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--sep)}
.active-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;background:#F5F0EB;color:var(--gold);border:1px solid var(--gold-dim)}
.active-tag button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;line-height:1;padding:0}
/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;align-items:start}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;position:relative;cursor:pointer}
.card-img{position:relative;aspect-ratio:3/4;background:#fff;overflow:hidden}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%;display:block;pointer-events:none}
.card:active .card-img img{transform:scale(1.03);transition:transform .2s}
.no-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.15;font-family:Georgia,serif;font-style:italic;pointer-events:none}
.fav-btn{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text3);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:all .15s;z-index:1}
.fav-btn:active{transform:scale(.88)}
.fav-btn.on{background:#F5F0E8;border-color:#C4A882;color:#8B6F4E}
.card-body{padding:9px 10px 10px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--sep)}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-brand{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.card-cat{flex-shrink:0;font-size:9.5px;font-weight:500;padding:2px 6px;border-radius:4px;white-space:nowrap}
.card-cat.k{background:var(--cat-k-bg);color:var(--cat-k)}.card-cat.e{background:var(--cat-e-bg);color:var(--cat-e)}.card-cat.u{background:var(--cat-u-bg);color:var(--cat-u)}
.card-name{font-size:12px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sentinel{height:1px;margin:4px 0}
#loader{display:none;text-align:center;padding:16px;color:var(--text3);font-size:12px}
.empty{display:none;padding:60px 24px;text-align:center;color:var(--text3)}
.empty p{font-size:14px}.empty small{font-size:11px;margin-top:6px;display:block}
/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:var(--safe-b);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:0;transition:color .15s;font-weight:500}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--gold)}
.nav-btn.fav-nav-btn{position:relative}
.fav-count{position:absolute;top:6px;right:calc(50% - 18px);background:var(--gold);color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center}
.fav-count.vis{display:flex}
/* DRAWERS */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}
.drawer-overlay.open{display:flex}
.drawer{background:#fff;border-top:1px solid var(--border);border-radius:16px 16px 0 0;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:var(--safe-b)}
.drawer-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 4px}
.drawer-title{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);padding:8px 16px 12px;border-bottom:1px solid var(--sep)}
.drawer-body{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.drawer-search-row{display:flex;gap:8px;margin-bottom:4px}
.drawer-search-wrap{position:relative;flex:1}
.drawer-search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#drawer-q{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:15px;font-family:inherit;padding:11px 12px 11px 36px;outline:none;-webkit-appearance:none}
#drawer-q:focus{border-color:var(--gold-dim)}
#drawer-q::placeholder{color:var(--text3)}
.search-go-btn{flex-shrink:0;padding:0 16px;background:var(--text);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.opt-list{display:flex;flex-direction:column;gap:2px}
.opt-item{display:flex;align-items:center;padding:11px 12px;border-radius:8px;cursor:pointer;border:none;background:none;color:var(--text);font-size:14px;font-family:inherit;text-align:left;width:100%;transition:background .1s}
.opt-item:active{background:var(--card2)}
.opt-item .chk{color:var(--gold);font-size:16px;display:none;margin-left:8px}
.opt-item.sel{color:var(--gold)}.opt-item.sel .chk{display:block}
.opt-count{font-size:12px;color:var(--text3);margin-left:auto;font-variant-numeric:tabular-nums}
/* FAV VIEW */
#fav-view{display:none;flex-direction:column}
#fav-view.open{display:flex}
.fav-header{padding:14px 12px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fav-header h2{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:18px;flex:1}
.back-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:26px;padding:0;line-height:1}
.fav-empty{padding:60px 24px;text-align:center;color:var(--text3)}
.wa-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:#25D366;color:#fff;border:none;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.wa-btn svg{width:16px;height:16px;fill:#fff;flex-shrink:0}
footer{padding:20px 16px;text-align:center;font-size:11px;color:var(--text3);letter-spacing:.08em;border-top:1px solid var(--border);margin-top:8px;background:#fff}
.footer-line{width:32px;height:1px;background:var(--border);margin:0 auto 10px}
/* DETAY */
#detail-view{display:none;flex-direction:column}
#detail-view.open{display:flex}
.detail-back-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--border)}
.detail-back-bar .back-btn{font-size:26px}
.detail-back-bar span{font-size:13px;font-weight:600;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* görsel alanı — fav butonu sağ üst */
.detail-img-wrap{position:relative;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px 32px}
.detail-img-wrap img{width:100%;max-width:320px;aspect-ratio:3/4;object-fit:contain;display:block}
.detail-img-ph{font-family:Georgia,serif;font-style:italic;font-size:60px;opacity:.1;padding:60px 0;text-align:center;width:100%}
.detail-fav-btn{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:#fff;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3);box-shadow:0 2px 8px rgba(0,0,0,.1);transition:all .15s;z-index:2}
.detail-fav-btn:active{transform:scale(.88)}
.detail-fav-btn.on{background:#F5F0E8;border-color:#C4A882;color:#8B6F4E}
.detail-body{padding:18px 16px 24px}
.detail-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.detail-brand{font-size:11px;color:var(--gold-dim);letter-spacing:.08em;text-transform:uppercase}
.detail-cat{font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px}
.detail-cat.k{background:var(--cat-k-bg);color:var(--cat-k)}.detail-cat.e{background:var(--cat-e-bg);color:var(--cat-e)}.detail-cat.u{background:var(--cat-u-bg);color:var(--cat-u)}
.detail-name{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:400;color:var(--text);line-height:1.3;margin-bottom:14px}
.detail-desc{font-size:14px;color:var(--text2);line-height:1.65;font-style:italic;border-left:2px solid var(--gold-dim);padding-left:12px;margin-bottom:22px}
.notes-title{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;font-weight:600}
.notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.note-col{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 10px;text-align:center}
.note-icon{font-size:18px;margin-bottom:6px}
.note-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;margin-bottom:6px}
.note-items{font-size:11px;color:var(--text2);line-height:1.5}
.detail-price{font-size:20px;font-weight:700;color:var(--text);margin-bottom:14px;font-variant-numeric:tabular-nums}</style>
</head>

function catKey(c){return c==='\u004bad\u0131n Parf\u00fcmleri'?'k':c==='Erkek Parf\u00fcmleri'?'e':c==='Unisex'?'u':'';}
function catShort(c){return c==='Kad\u0131n Parf\u00fcmleri'?'Kad\u0131n':c==='Erkek Parf\u00fcmleri'?'Erkek':c||'';}
function saveFavs(){localStorage.setItem(FAV_KEY,JSON.stringify(Object.keys(favSet)));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function priceHtml(d,cls){
  if(!d.p) return '';
  if(d.p0!=null && d.p0>d.p){
    return '<div class="'+cls+'"><span style="text-decoration:line-through;color:var(--text3);font-weight:400;font-size:0.82em;margin-right:6px">'+d.p0.toLocaleString('tr-TR')+' \u20ba</span><span style="color:#b45309">'+d.p.toLocaleString('tr-TR')+' \u20ba</span></div>';
  }
  return '<div class="'+cls+'">'+d.p.toLocaleString('tr-TR')+' \u20ba</div>';
}

function cardHTML(d,idx){
  var ck=catKey(d.c),cs=catShort(d.c),isFav=!!favSet[d.n];
  var imgEl=d.i?('<img src="'+esc(d.i)+'" alt="'+esc(d.n)+'" loading="lazy" decoding="async">'):'<div class="no-img-ph">\u25c8</div>';
  var catEl=ck?('<span class="card-cat '+ck+'">'+cs+'</span>'):'';
  var priceEl=priceHtml(d,'card-price');
  return '<article class="card" onclick="openDetail('+idx+')">'
    +'<div class="card-img">'+imgEl
    +'<button class="fav-btn'+(isFav?' on':'')+'" data-n="'+esc(d.n)+'" onclick="event.stopPropagation();toggleFav(this)">'+(isFav?'\u2713':'+')+'</button>'
    +'</div><div class="card-body">'
    +'<div class="card-meta"><span class="card-brand">'+esc(d.b)+'</span>'+catEl+'</div>'
    +'<div class="card-name">'+esc(d.n)+'</div>'
    +priceEl
    +'</div></article>';
}

function toggleFav(btn){
  var name=btn.dataset.n;
  favSet[name]?delete favSet[name]:(favSet[name]=true);
  saveFavs(); updateFavCount();
  document.querySelectorAll('.fav-btn[data-n],.detail-fav-btn[data-n]').forEach(function(b){
    if(b.dataset.n===name){b.classList.toggle('on',!!favSet[name]);b.textContent=favSet[name]?'\u2713':'+';}
  });
  if(document.getElementById('fav-view').classList.contains('open')) renderFavView();
}

function updateFavCount(){
  var n=Object.keys(favSet).length,el=document.getElementById('fav-count');
  el.textContent=n; el.classList.toggle('vis',n>0);
}

function applyFilter(){
  var lq=q.toLowerCase(); filtered=[];
  for(var i=0;i<DATA.length;i++){
    var d=DATA[i];
    if(activeCat&&d.c!==activeCat&&!(d.c==='Unisex'&&(activeCat==='Kadın Parfümleri'||activeCat==='Erkek Parfümleri'))) continue;
    if(activeBrand&&d.b!==activeBrand) continue;
    if(lq&&d.n.toLowerCase().indexOf(lq)<0&&d.b.toLowerCase().indexOf(lq)<0&&d.c.toLowerCase().indexOf(lq)<0) continue;
    filtered.push(d);
  }
  shownCount=0; document.getElementById('grid').innerHTML='';
  renderMore(); updateStrip(); updateNavActive();
}

function renderMore(){
  if(shownCount>=filtered.length){
    document.getElementById('loader').style.display='none';
    document.getElementById('empty').style.display=filtered.length===0?'block':'none';
    return;
  }
  document.getElementById('empty').style.display='none';
  var slice=filtered.slice(shownCount,shownCount+PAGE),html='';
  for(var i=0;i<slice.length;i++) html+=cardHTML(slice[i],DATA.indexOf(slice[i]));
  document.getElementById('grid').insertAdjacentHTML('beforeend',html);
  shownCount+=slice.length;
  document.getElementById('loader').style.display=shownCount<filtered.length?'block':'none';
}

function updateStrip(){
  var strip=document.getElementById('active-strip'),tags=[];
  if(activeCat) tags.push('<span class="active-tag">'+catShort(activeCat)+' <button onclick="setCat(\'\')">&#215;</button></span>');
  if(activeBrand) tags.push('<span class="active-tag">'+esc(activeBrand)+' <button onclick="setBrand(\'\')">&#215;</button></span>');
  if(q) tags.push('<span class="active-tag">"'+esc(q)+'" <button onclick="clearQ()">&#215;</button></span>');
  strip.style.display=tags.length?'flex':'none'; strip.innerHTML=tags.join('');
}
function updateNavActive(){
  var any=!!(q||activeCat||activeBrand);
  document.getElementById('nav-home').classList.toggle('active',!any);
  document.getElementById('nav-search').classList.toggle('active',!!q);
  document.getElementById('nav-cat').classList.toggle('active',!!activeCat);
  document.getElementById('nav-brand').classList.toggle('active',!!activeBrand);
}

var observer=new IntersectionObserver(function(e){if(e[0].isIntersecting) renderMore();},{rootMargin:'200px'});
observer.observe(document.getElementById('sentinel'));

function openDrawer(id){
  if(id==='search'){document.getElementById('drawer-search').classList.add('open');setTimeout(function(){document.getElementById('drawer-q').focus();},120);}
  else if(id==='cat'){buildCatList();document.getElementById('drawer-cat').classList.add('open');}
  else if(id==='brand'){buildBrandList();document.getElementById('drawer-brand').classList.add('open');}
}
function closeIf(e,id){if(e.target===e.currentTarget) document.getElementById(id).classList.remove('open');}
function doSearch(){q=document.getElementById('drawer-q').value.trim();document.getElementById('drawer-search').classList.remove('open');applyFilter();}
document.getElementById('drawer-q').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doSearch();}});

function buildCatList(){
  var cats=[['','T\u00fcm\u00fc'],['Kad\u0131n Parf\u00fcmleri','Kad\u0131n'],['Erkek Parf\u00fcmleri','Erkek'],['Unisex','Unisex']];
  var html='';
  for(var i=0;i<cats.length;i++){
    var v=cats[i][0],l=cats[i][1],cnt=0;
    for(var j=0;j<DATA.length;j++) if(!v||DATA[j].c===v||(DATA[j].c==='Unisex'&&(v==='Kadın Parfümleri'||v==='Erkek Parfümleri'))) cnt++;
    html+='<button class="opt-item'+(activeCat===v?' sel':'')+'" onclick="setCat(\''+v+'\')"><span>'+l+'</span><span class="opt-count">'+cnt+'</span><span class="chk">\u2713</span></button>';
  }
  document.getElementById('cat-list').innerHTML=html;
}
function setCat(c){activeCat=c;document.getElementById('drawer-cat').classList.remove('open');applyFilter();}

function buildBrandList(){
  var items=[['','T\u00fcm Markalar']];
  for(var i=0;i<BRANDS.length;i++) items.push([BRANDS[i],BRANDS[i]]);
  var html='';
  for(var i=0;i<items.length;i++){
    var v=items[i][0],l=items[i][1],cnt=0;
    for(var j=0;j<DATA.length;j++) if(!v||DATA[j].b===v) cnt++;
    html+='<button class="opt-item'+(activeBrand===v?' sel':'')+'" data-bv="'+esc(v)+'" onclick="pickBrand(this)"><span>'+esc(l)+'</span><span class="opt-count">'+cnt+'</span><span class="chk">\u2713</span></button>';
  }
  document.getElementById('brand-list').innerHTML=html;
}
function pickBrand(el){setBrand(el.getAttribute('data-bv'));}
function setBrand(b){activeBrand=b;document.getElementById('drawer-brand').classList.remove('open');applyFilter();}
function clearQ(){q='';document.getElementById('drawer-q').value='';applyFilter();}

function setMainVisible(v){
  ['grid','sentinel','loader','empty','active-strip'].forEach(function(id){
    var el=document.getElementById(id);if(el) el.style.display=v?'':'none';
  });
  var ft=document.querySelector('footer');if(ft) ft.style.display=v?'':'none';
}
function goHome(){
  q='';activeCat='';activeBrand='';
  document.getElementById('drawer-q').value='';
  closeDetail(); closeFavView(); applyFilter();
  window.scrollTo({top:0,behavior:'smooth'});
}
function openFavView(){
  closeDetail();
  setMainVisible(false);
  document.getElementById('fav-view').classList.add('open');
  document.getElementById('nav-fav').classList.add('active');
  renderFavView();
  window.scrollTo({top:0,behavior:'instant'});
}
function closeFavView(){
  document.getElementById('fav-view').classList.remove('open');
  document.getElementById('nav-fav').classList.remove('active');
  setMainVisible(true);
}
function renderFavView(){
  var fd=[];for(var i=0;i<DATA.length;i++) if(favSet[DATA[i].n]) fd.push(DATA[i]);
  var grid=document.getElementById('fav-grid'),empty=document.getElementById('fav-empty'),waBtn=document.getElementById('wa-share-btn');
  document.getElementById('fav-hdr-count').textContent=fd.length?fd.length+' \u00fcr\u00fcn':'';
  waBtn.style.display=fd.length?'inline-flex':'none';
  if(!fd.length){grid.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  var html='';for(var i=0;i<fd.length;i++) html+=cardHTML(fd[i],DATA.indexOf(fd[i]));
  grid.innerHTML=html;
}
function waTargetUrl(num,text){
  var enc=encodeURIComponent(text);
  var isAndroid=/Android/i.test(navigator.userAgent||'');
  if(isAndroid){
    return 'intent://send?phone='+num+'&text='+enc+'#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url='+encodeURIComponent('https://api.whatsapp.com/send?phone='+num+'&text='+enc)+';end';
  }
  return 'https://api.whatsapp.com/send?phone='+num+'&text='+enc;
}
function isInAppBrowser(){
  return /TikTok|musical_ly|BytedanceWebview|Instagram|FBAN|FBAV|Line\//i.test(navigator.userAgent||'');
}
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).catch(function(){}); return; }
  var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); }catch(err){}
  document.body.removeChild(ta);
}
function shareWA(e){
  var fd=[];for(var i=0;i<DATA.length;i++) if(favSet[DATA[i].n]) fd.push(DATA[i]);
  if(!fd.length){ e.preventDefault(); return; }
  try{ fetch('https://ormivo.com/api/public/bayi-tiklama/misk',{method:'POST',keepalive:true}).catch(function(){}); }catch(err){}
  var lines=['Merhaba, sepetimdeki \u00fcr\u00fcnleri sipari\u015f etmek istiyorum:',''];
  for(var i=0;i<fd.length;i++) lines.push((i+1)+'. '+fd[i].n+' - '+fd[i].b+(fd[i].p?' ('+fd[i].p.toLocaleString('tr-TR')+' \u20ba)':''));
  var msg=lines.join('\n');
  if(isInAppBrowser()){
    e.preventDefault();
    copyToClipboard(msg);
    alert('Sipari\u015f mesaj\u0131n\u0131z kopyaland\u0131!\n\nBu uygulama i\u00e7i taray\u0131c\u0131 WhatsApp\u2019\u0131 do\u011frudan a\u00e7am\u0131yor. Sa\u011f \u00fcstteki \u22ef men\u00fcs\u00fcnden "Taray\u0131c\u0131da A\u00e7"\u0131 se\u00e7ip tekrar deneyin, ya da WhatsApp\u2019\u0131 kendiniz a\u00e7\u0131p mesaj\u0131 yap\u0131\u015ft\u0131r\u0131n.');
    return;
  }
  e.currentTarget.href=waTargetUrl('905387939153',msg);
}

function openDetail(idx){
  var d=DATA[idx]; if(!d) return;
  var ck=catKey(d.c),cs=catShort(d.c),isFav=!!favSet[d.n];
  var imgEl=d.i?('<img src="'+esc(d.i)+'" alt="'+esc(d.n)+'" loading="lazy">'):'<div class="detail-img-ph">\u25c8</div>';
  var catEl=ck?('<span class="detail-cat '+ck+'">'+cs+'</span>'):'';
  var priceEl=priceHtml(d,'detail-price');
  var descEl=d.desc?('<div class="detail-desc">'+esc(d.desc)+'</div>'):'';
  var notesEl='';
  if(d.top||d.mid||d.base){
    notesEl='<div class="notes-title">Koku Notalar\u0131</div><div class="notes-grid">'
      +'<div class="note-col"><div class="note-icon">\uD83C\uDF3F</div><div class="note-label">\u00dcst Notalar</div><div class="note-items">'+(d.top?esc(d.top):'<span style="color:var(--text3)">—</span>')+'</div></div>'
      +'<div class="note-col"><div class="note-icon">\uD83C\uDF38</div><div class="note-label">Orta Notalar</div><div class="note-items">'+(d.mid?esc(d.mid):'<span style="color:var(--text3)">—</span>')+'</div></div>'
      +'<div class="note-col"><div class="note-icon">\uD83E\uDEB5</div><div class="note-label">Alt Notalar</div><div class="note-items">'+(d.base?esc(d.base):'<span style="color:var(--text3)">—</span>')+'</div></div>'
      +'</div>';
  }
  var dv=document.getElementById('detail-view');
  dv.innerHTML=
    '<div class="detail-back-bar"><button class="back-btn" onclick="closeDetail()">&#8249;</button><span>'+esc(d.n)+'</span></div>'
    +'<div class="detail-img-wrap">'
      +imgEl
      +'<button class="detail-fav-btn'+(isFav?' on':'')+'" data-n="'+esc(d.n)+'" onclick="toggleFav(this)">'+(isFav?'\u2713':'+')+'</button>'
    +'</div>'
    +'<div class="detail-body">'
      +'<div class="detail-meta"><span class="detail-brand">'+esc(d.b)+'</span>'+catEl+'</div>'
      +'<div class="detail-name">'+esc(d.n)+'</div>'
      +priceEl+descEl+notesEl
    +'</div>';
  closeFavView();
  setMainVisible(false);
  dv.classList.add('open');
  window.scrollTo({top:0,behavior:'instant'});
}
function closeDetail(){
  var dv=document.getElementById('detail-view');
  dv.classList.remove('open');
  dv.innerHTML='';
  setMainVisible(true);
}

updateFavCount();
applyFilter();
(function(){
  // Sitede kapatılan/silinen ürünleri bu statik katalogdan otomatik gizler.
  // Ağ isteği başarısız olursa (offline, timeout) hiçbir şey gizlenmez —
  // katalog her zaman çalışır durumda kalır.
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var t=ctrl?setTimeout(function(){ctrl.abort();},4000):null;
  fetch('https://ormivo.com/api/public/pasif-urunler',{signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(t) clearTimeout(t);
      if(!j||!j.closed||!j.closed.length) return;
      var closed={};
      for(var i=0;i<j.closed.length;i++) closed[j.closed[i]]=true;
      var before=DATA.length;
      DATA=DATA.filter(function(d){
        var path=d.i.replace('https://ormivo.com','');
        return !closed[path];
      });
      if(DATA.length!==before) applyFilter();
    })
    .catch(function(){ if(t) clearTimeout(t); });
})();
(function(){
  // Bayinin kendi belirlediği satış fiyatları ve aktifse kampanya indirimi
  // gömülü fiyatların üzerine uygulanır.
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var t=ctrl?setTimeout(function(){ctrl.abort();},4000):null;
  fetch('https://ormivo.com/api/public/bayi-fiyat/misk',{signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(j){
      if(t) clearTimeout(t);
      if(!j) return;
      var prices=j.prices||{},changed=false;
      for(var i=0;i<DATA.length;i++){
        var path=DATA[i].i.replace('https://ormivo.com','');
        if(prices[path]!=null && DATA[i].p!==prices[path]){ DATA[i].p=prices[path]; changed=true; }
      }
      if(j.campaign&&j.campaign.active&&j.campaign.pct>0){
        var f=1-(j.campaign.pct/100);
        for(var k=0;k<DATA.length;k++){ DATA[k].p0=DATA[k].p; DATA[k].p=Math.round(DATA[k].p*f); }
        changed=true;
      }
      if(changed) applyFilter();
    })
    .catch(function(){ if(t) clearTimeout(t); });
})();
(function(){
  var ua=navigator.userAgent||'';
  if(/TikTok|musical_ly|BytedanceWebview|Instagram|FBAN|FBAV|Line\//i.test(ua)){
    var b=document.getElementById('iab-banner'); if(b) b.style.display='block';
  }
})();
</script>
